{% load custom_filters %}
<div class="review-card-wrapper">
    <div class="review-card">
        <div class="flex justify-between items-start mb-4">
            <div class="flex items-center space-x-3">
                <img src="{% if testimonial.profile_image %}{{ testimonial.profile_image }}{% else %}https://api.dicebear.com/7.x/initials/svg?seed={{ testimonial.name|urlencode }}{% endif %}" 
                     alt="{{ testimonial.name }}" 
                     class="reviewer-avatar"
                     loading="lazy">
                <div class="overflow-hidden">
                    <h3 class="font-bold text-gray-900 text-sm leading-tight truncate w-32">{{ testimonial.name }}</h3>
                    <p class="text-[11px] text-gray-500 mt-0.5">{{ testimonial.review_date }}</p>
                </div>
            </div>
            <div class="google-g-icon">
                <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
                    <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
                    <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z" fill="#FBBC05"/>
                    <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
                </svg>
            </div>
        </div>

        <div class="star-rating-container">
            {% for _ in testimonial.rating|get_range %}
                <i data-lucide="star" class="star-icon"></i>
            {% endfor %}
            {% with testimonial.rating|multiply:-1|add:5 as empty_stars %}
                {% for _ in empty_stars|get_range %}
                    <i data-lucide="star" class="star-icon empty"></i>
                {% endfor %}
            {% endwith %}
            <i data-lucide="check-circle-2" class="verified-check"></i>
        </div>

        <div class="flex-grow">
            <p class="review-text-content">
                {{ testimonial.text }}
            </p>
        </div>
    </div>
</div>
