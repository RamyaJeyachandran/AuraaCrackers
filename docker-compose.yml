services:
  redis:
    image: redis:7
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always

  web:
    build: .
    volumes:
      - .:/app
    command: sh -c "python manage.py collectstatic --noinput && python manage.py runserver 0.0.0.0:8000"
    environment:
      - DEBUG=True
      - PYTHONPATH=/app
      - DB_NAME=${DB_NAME:-auraacrackers}
      - DB_USER=${DB_USER:-auraauser}
      - DB_PASSWORD=${DB_PASSWORD:-auraapass}
      - DB_HOST=${DB_HOST:-db}
      - DB_PORT=5432
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - CACHE_URL=redis://redis:6379/1
      - APIFY_TOKEN=${APIFY_TOKEN}
    ports:
      - "8000:8000"
    depends_on:
      redis:
        condition: service_healthy
    restart: always

  celery_worker:
    build: .
    volumes:
      - .:/app
    command: sh -c "celery -A config.celery worker --loglevel=info --concurrency=4"
    environment:
      - PYTHONPATH=/app
      - DB_NAME=${DB_NAME:-auraacrackers}
      - DB_USER=${DB_USER:-auraauser}
      - DB_PASSWORD=${DB_PASSWORD:-auraapass}
      - DB_HOST=${DB_HOST:-db}
      - DB_PORT=5432
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - CACHE_URL=redis://redis:6379/1
      - APIFY_TOKEN=${APIFY_TOKEN}
    depends_on:
      redis:
        condition: service_healthy
    restart: always

  celery_beat:
    build: .
    volumes:
      - .:/app
    command: sh -c "celery -A config.celery beat --loglevel=info"
    environment:
      - PYTHONPATH=/app
      - DB_NAME=${DB_NAME:-auraacrackers}
      - DB_USER=${DB_USER:-auraauser}
      - DB_PASSWORD=${DB_PASSWORD:-auraapass}
      - DB_HOST=${DB_HOST:-db}
      - DB_PORT=5432
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - CACHE_URL=redis://redis:6379/1
      - APIFY_TOKEN=${APIFY_TOKEN}
    depends_on:
      redis:
        condition: service_healthy
    restart: always

  flower:
    build: .
    volumes:
      - .:/app
    command: sh -c "celery -A config.celery flower --port=5555"
    ports:
      - "5555:5555"
    environment:
      - PYTHONPATH=/app
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
    restart: always

  nginx:
    build:
      context: .
      dockerfile: nginx/Dockerfile
    ports:
      - "8081:80"
      - "4431:443"
    volumes:
      - ./staticfiles:/var/www/static
      - ./media:/var/www/media
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/letsencrypt
      - ./nginx/webroot:/var/www/certbot
    depends_on:
      - web
    restart: always

  certbot:
    image: certbot/certbot
    volumes:
      - ./nginx/ssl:/etc/letsencrypt
      - ./nginx/webroot:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"

volumes:
  redis_data:
