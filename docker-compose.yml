services:
  redis:
    image: redis:7
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always

  web:
    build: .
    volumes:
      - .:/app
    command: sh -c "python manage.py collectstatic --noinput && python manage.py runserver 0.0.0.0:8000"
    environment:
      - DEBUG=True
      - PYTHONPATH=/app
      - DB_NAME=${DB_NAME:-auraacrackers}
      - DB_USER=${DB_USER:-auraauser}
      - DB_PASSWORD=${DB_PASSWORD:-auraapass}
      - DB_HOST=${DB_HOST:-db}
      - DB_PORT=5432
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - CACHE_URL=redis://redis:6379/1
      - APIFY_TOKEN=${APIFY_TOKEN}
    depends_on:
      redis:
        condition: service_healthy
    restart: always

  celery_worker:
    build: .
    volumes:
      - .:/app
    command: sh -c "celery -A config.celery worker --loglevel=info --concurrency=4"
    environment:
      - PYTHONPATH=/app
      - DB_NAME=${DB_NAME:-auraacrackers}
      - DB_USER=${DB_USER:-auraauser}
      - DB_PASSWORD=${DB_PASSWORD:-auraapass}
      - DB_HOST=${DB_HOST:-db}
      - DB_PORT=5432
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - CACHE_URL=redis://redis:6379/1
      - APIFY_TOKEN=${APIFY_TOKEN}
    depends_on:
      redis:
        condition: service_healthy
    restart: always

  celery_beat:
    build: .
    volumes:
      - .:/app
    command: sh -c "celery -A config.celery beat --loglevel=info"
    environment:
      - PYTHONPATH=/app
      - DB_NAME=${DB_NAME:-auraacrackers}
      - DB_USER=${DB_USER:-auraauser}
      - DB_PASSWORD=${DB_PASSWORD:-auraapass}
      - DB_HOST=${DB_HOST:-db}
      - DB_PORT=5432
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - CACHE_URL=redis://redis:6379/1
      - APIFY_TOKEN=${APIFY_TOKEN}
    depends_on:
      redis:
        condition: service_healthy
    restart: always

  flower:
    build: .
    volumes:
      - .:/app
    command: sh -c "celery -A config.celery flower --port=5555"
    environment:
      - PYTHONPATH=/app
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
    restart: always

  nginx:
    build:
      context: .
      dockerfile: nginx/Dockerfile
    volumes:
      - ./staticfiles:/var/www/static
      - ./media:/var/www/media
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - web
    restart: always
    networks:
      - default
      - proxy-network

volumes:
  redis_data:

networks:
  default:
  proxy-network:
    external: true
