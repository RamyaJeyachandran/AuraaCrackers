{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bulk Estimates - Auraa Crackers</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            -webkit-print-color-adjust: exact;
        }
        @page {
            size: A4;
            margin: 1cm;
        }
        @media print {
            body {
                background: white;
            }
            .no-print {
                display: none;
            }
            .print-container {
                box-shadow: none !important;
                border: none !important;
                width: 100% !important;
                max-width: none !important;
                margin: 0 !important;
                padding: 0 !important;
            }
        }
    </style>
</head>
<body class="bg-gray-100 print:bg-white pb-20 print:pb-0">
    <div class="no-print bg-auraa-red text-white p-4 sticky top-0 z-50 flex justify-between items-center shadow-lg">
        <div class="flex items-center gap-3">
            <i data-lucide="printer" class="w-6 h-6"></i>
            <h1 class="text-lg font-black uppercase tracking-tight">Bulk Print ({{ orders|length }} Orders)</h1>
        </div>
        <button onclick="window.print()" class="bg-white text-auraa-red px-6 py-2 rounded-full font-black text-xs uppercase tracking-widest hover:bg-gray-100 transition-all active:scale-95 shadow-md">
            Print All
        </button>
    </div>

    <div class="space-y-8 print:space-y-0">
        {% for order in orders %}
            {% include 'includes/order_estimate_content.html' with order=order items=order.items_list %}
        {% endfor %}
    </div>

    <!-- PDF Generation & Icons Library -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
        window.onload = function() {
            // Initialize icons
            if (window.lucide) lucide.createIcons();

            const urlParams = new URLSearchParams(window.location.search);
            
            // Auto print if direct print requested
            if (urlParams.get('print') === 'true') {
                setTimeout(() => {
                    window.focus();
                    window.print();
                    // Notify parent that printing has started
                    if (window.parent && window.parent !== window) {
                        window.parent.postMessage('auraa_print_started', '*');
                    }
                }, 1000); // Slightly longer delay for multiple orders
            }
        };
    </script>
</body>
</html>
