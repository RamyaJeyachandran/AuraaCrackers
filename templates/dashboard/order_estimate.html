{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estimate - {{ order.trans_no }}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            -webkit-print-color-adjust: exact;
        }
        @page {
            size: A4;
            margin: 1cm;
        }
        @media print {
            body {
                background: white;
            }
            .no-print {
                display: none;
            }
            .print-container {
                box-shadow: none !important;
                border: none !important;
                width: 100% !important;
                max-width: none !important;
                margin: 0 !important;
                padding: 0 !important;
            }
        }
    </style>
</head>
<body class="bg-white">
    <!-- Estimate Container -->
    {% with order.items_list as items %}
        {% include 'includes/order_estimate_content.html' with order=order items=items %}
    {% endwith %}
    </div>

    <!-- PDF Generation & Icons Library -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <script>
        window.onload = function() {
            // Initialize icons
            if (window.lucide) lucide.createIcons();

            const urlParams = new URLSearchParams(window.location.search);
            
            // Auto print if direct print requested
            if (urlParams.get('print') === 'true') {
                // Ensure Tailwind and icons are rendered before printing
                setTimeout(() => {
                    window.focus();
                    window.print();
                    // Notify parent that printing has started
                    if (window.parent && window.parent !== window) {
                        window.parent.postMessage('auraa_print_started', '*');
                    }
                }, 800);
            }
            
            // Auto download if requested
            if (urlParams.get('download') === 'true') {
                const element = document.querySelector('.print-container');
                const opt = {
                    margin:       [10, 10, 10, 10], // top, left, bottom, right in mm
                    filename:     'Estimate_{{ order.trans_no }}.pdf',
                    image:        { type: 'jpeg', quality: 0.98 },
                    html2canvas:  { scale: 2, useCORS: true },
                    jsPDF:        { unit: 'mm', format: 'a4', orientation: 'portrait' }
                };
                
                html2pdf().set(opt).from(element).save();
            }
        };
    </script>
</body>
</html>
