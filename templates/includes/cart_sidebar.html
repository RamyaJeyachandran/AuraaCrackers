<!-- Cart Sidebar -->
<div id="cart-sidebar" class="fixed inset-y-0 right-0 w-full sm:w-96 bg-white z-[100001] transform translate-x-full invisible transition-all duration-500 shadow-2xl flex flex-col">
    <!-- Header -->
    <div class="px-6 py-6 border-b border-gray-100 flex items-center justify-between bg-gray-900 text-white">
        <h2 class="text-lg font-black uppercase tracking-tight">Your Cart</h2>
        <button onclick="toggleCartSidebar()" class="p-2 hover:bg-white/10 rounded-full transition-colors">
            <i data-lucide="x" class="w-6 h-6"></i>
        </button>
    </div>

    <!-- Items -->
    <div id="cart-items-container" class="flex-grow overflow-y-auto p-6 space-y-6">
        <!-- Cart items will be injected here via JS -->
    </div>

    <!-- Summary & Actions -->
    <!-- Summary & Actions -->
    <div class="p-6 lg:p-8 bg-white border-t border-gray-100 flex flex-col">
        <!-- Collapsible Toggle -->
        <button onclick="toggleCartSummary()" class="flex items-center justify-between w-full mb-4 text-[10px] font-black uppercase tracking-[0.2em] text-auraa-red hover:text-gray-900 transition-colors group">
            <span>Order Details</span>
            <div class="flex items-center gap-2">
                <span id="summary-toggle-text" class="text-[8px] opacity-60">Show</span>
                <i data-lucide="chevron-up" id="summary-toggle-icon" class="w-3 h-3 transition-transform duration-300 rotate-180"></i>
            </div>
        </button>

        <div id="cart-summary-details" style="max-height: 0px; opacity: 0;" class="space-y-4 overflow-hidden transition-all duration-500">
            <!-- Totals -->
            <div class="flex justify-between items-center text-[11px] font-bold uppercase tracking-wider text-gray-500">
                <span>Net Total</span>
                <span id="cart-net-total" class="text-[#0A325A]">₹ 0.00</span>
            </div>
            <div class="flex justify-between items-center text-[11px] font-bold uppercase tracking-wider text-gray-500">
                <span>Discount Total</span>
                <span id="cart-discount-total" class="text-green-600">₹ 0.00</span>
            </div>
            <div class="flex justify-between items-center text-[11px] font-black uppercase tracking-widest text-[#0A325A] pt-2 border-t border-gray-50">
                <span>Sub Total</span>
                <span id="cart-sub-total">₹ 0.00</span>
            </div>

            <!-- Promo Section -->
            <div class="pt-2 border-t border-gray-50">
                <div class="flex justify-between items-center">
                    <button onclick="showSidebarPromoInput()" class="flex items-center space-x-2 text-[10px] font-black uppercase tracking-widest text-auraa-red hover:underline">
                        <i data-lucide="ticket" class="w-3 h-3"></i>
                        <span>Have Promotion Code?</span>
                    </button>
                    <span id="cart-promo-discount" class="text-[10px] font-black text-auraa-red">- ₹ 0.00</span>
                </div>
                <div id="sidebar-promo-input-container" class="hidden mt-3 flex items-center gap-2">
                    <input type="text" id="sidebar-promo-code-input" placeholder="CODE" class="flex-grow px-4 py-2 bg-gray-50 border border-gray-100 rounded-xl text-[10px] font-bold uppercase focus:outline-none focus:border-auraa-red">
                    <button onclick="applySidebarPromoCode()" class="px-4 py-2 bg-gray-900 text-white rounded-xl text-[10px] font-black uppercase tracking-widest hover:bg-auraa-red transition-all">Apply</button>
                </div>
            </div>

            <!-- Min Order & Charges -->
            <div class="space-y-1">
                <div class="flex justify-between items-center text-[10px] font-black uppercase tracking-widest text-auraa-red italic">
                    <span>Min.Order Amount</span>
                    <span>₹ 3000.00</span>
                </div>
                <div id="cart-min-order-error" class="hidden text-center py-2 bg-red-50 border border-red-100 rounded-xl">
                    <p class="text-[9px] font-black text-auraa-red uppercase tracking-widest">
                        Add ₹ <span id="cart-min-order-diff">0.00</span> more to enable order
                    </p>
                </div>
            </div>

            <div class="pt-4 space-y-3">
                <div class="flex justify-between items-center text-[11px] font-bold uppercase tracking-wider text-gray-500">
                    <span>Packing Charges (3%)</span>
                    <span id="cart-packing" class="text-[#0A325A]">₹ 0.00</span>
                </div>
                <div class="flex justify-between items-center text-[11px] font-bold uppercase tracking-wider text-gray-500">
                    <span>Round Off</span>
                    <span id="cart-roundoff" class="text-[#0A325A]">₹ 0.00</span>
                </div>
            </div>
        </div>

        <div class="pt-4 border-t-2 border-[#0A325A] mt-4">
            <div class="flex justify-between items-center">
                <span class="text-sm font-black uppercase tracking-[0.2em] text-[#0A325A]">Overall &nbsp; Amount</span>
                <span id="cart-overall-total" class="text-xl font-black text-auraa-red">₹ 0.00</span>
            </div>
        </div>

        <div class="pt-6">
            <button id="confirm-estimate-btn" onclick="handleSidebarCheckout()" class="w-full bg-auraa-red text-white py-5 rounded-[2rem] font-black uppercase tracking-widest text-xs shadow-2xl shadow-auraa-red/30 hover:bg-gray-900 transition-all active:scale-[0.98] disabled:opacity-50 disabled:grayscale disabled:cursor-not-allowed">
                Place Order
            </button>
        </div>
    </div>
</div>

<script>
    function toggleCartSummary() {
        const summary = document.getElementById('cart-summary-details');
        const icon = document.getElementById('summary-toggle-icon');
        const text = document.getElementById('summary-toggle-text');
        
        if (summary.style.maxHeight === '0px' || summary.style.maxHeight === '') {
            summary.style.maxHeight = summary.scrollHeight + 'px';
            summary.style.opacity = '1';
            summary.style.marginTop = '1rem';
            icon.classList.remove('rotate-180');
            text.innerText = 'Hide';
        } else {
            summary.style.maxHeight = '0px';
            summary.style.opacity = '0';
            summary.style.marginTop = '0';
            icon.classList.add('rotate-180');
            text.innerText = 'Show';
        }
    }
    
    // Initialize state
    document.addEventListener('DOMContentLoaded', () => {
        const summary = document.getElementById('cart-summary-details');
        if (summary) {
            summary.style.maxHeight = '0px';
            summary.style.opacity = '0';
        }
    });
</script>
</div>

<!-- Backdrop -->
<div id="cart-backdrop" class="fixed inset-0 bg-black/50 z-[100000] hidden opacity-0 transition-opacity duration-500" onclick="toggleCartSidebar()"></div>
