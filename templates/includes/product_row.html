{% load static %}
<tr class="product-row group transition-all duration-300 border-b border-gray-100 relative z-10 hover:z-[1001] {% if product.is_disabled %}bg-gray-300 grayscale cursor-not-allowed pointer-events-none{% else %}bg-white cursor-pointer hover:bg-gray-50{% endif %}" 
    id="product-row-{{ product.id }}" 
    {% if product.is_disabled == 0 %}onclick="selectProductRow('{{ product.id }}', event)"{% endif %}>
    
    <!-- Toggle Placeholder -->
    <td class="py-1 lg:py-1.5 px-2 lg:px-3 text-center"></td>
    
    <!-- Code -->
    <td class="py-1 lg:py-1.5 px-2 lg:px-3" data-label="Code">
        <span class="text-[10px] font-black text-gray-900 border-b-2 border-auraa-red/30 group-hover:border-auraa-red transition-all">{{ product.code|default:'-' }}</span>
    </td>

    <!-- Image -->
    <td class="py-1 lg:py-1.5 px-2 lg:px-3 product-image-cell" data-label="Image">
        <div class="relative w-12 h-12 md:w-10 md:h-10 rounded-xl bg-gray-50 group/img flex items-center justify-center p-1.5 shadow-sm border border-gray-100">
            <img src="{% if product.image and 'noimage' not in product.image and 'list_product_image' not in product.image %}{{ product.image }}{% else %}{% static 'images/logo.png' %}{% endif %}" 
                 onmouseover="openProductSlideshow(this.src, '{{ product.name|escapejs }}'); event.stopPropagation();"
                 alt="{{ product.name }}" loading="lazy" class="w-full h-full object-contain transition-transform duration-700 group-hover/img:scale-110 cursor-zoom-in">
        </div>
    </td>

    <!-- Product Name -->
    <td class="py-1 lg:py-1.5 px-2 lg:px-4 product-name-cell" data-label="Product">
        <div class="flex flex-col product-name-container relative">
            <span class="text-base md:text-[18px] font-black text-gray-900 group-hover:text-auraa-red transition-colors block leading-tight uppercase tracking-tight">{{ product.name }}</span>
        </div>
    </td>

    <!-- Actual Price -->
    <td class="py-1 lg:py-1.5 px-4 lg:px-6 text-center lg:text-center" data-label="Actual Price">
        <span class="text-xs text-gray-400 line-through font-bold">
            {% if product.purchase_rate %}₹{{ product.purchase_rate }}{% else %}-{% endif %}
        </span>
    </td>

    <!-- Price -->
    <td class="py-1 lg:py-1.5 px-2 lg:px-3 text-center lg:text-center" data-label="Price">
        <div class="bg-gray-50 px-3 lg:px-4 py-2.5 rounded-xl inline-block border border-gray-100 group-hover:bg-gray-100 group-hover:border-auraa-red/20 transition-all">
            <span class="text-sm font-black text-gray-900">₹{{ product.price }}</span>
        </div>
    </td>

    <!-- Quantity -->
    <td class="py-1 lg:py-1.5 px-4 lg:px-6" data-label="Quantity">
        <div class="flex items-center justify-center">
            <div class="flex items-center bg-white border-2 border-auraa-red rounded-xl lg:rounded-2xl p-0.5 lg:p-1 shadow-lg group-hover:shadow-auraa-red/20 transition-all {% if product.is_disabled %}opacity-30 grayscale{% endif %}">
                <button {% if product.is_disabled %}disabled{% endif %} onclick="updateQty('{{ product.id }}', -1)" class="w-8 h-8 rounded-lg bg-white flex items-center justify-center text-auraa-red hover:bg-gray-50 transition-all font-black">-</button>
                <input type="number" id="qty-{{ product.id }}" value="0" min="0" onchange="calculateTotal('{{ product.id }}')" 
                       {% if product.is_disabled %}disabled{% endif %}
                       class="w-12 bg-white rounded-lg mx-1 h-8 text-center text-sm font-black text-gray-900 focus:outline-none [appearance:textfield] [&::-webkit-outer-spin-button]:appearance-none [&::-webkit-inner-spin-button]:appearance-none">
                <button {% if product.is_disabled %}disabled{% endif %} onclick="updateQty('{{ product.id }}', 1)" class="w-8 h-8 rounded-lg bg-white flex items-center justify-center text-auraa-red hover:bg-gray-50 transition-all font-black">+</button>
            </div>
        </div>
    </td>

    <!-- Total -->
    <td class="py-1 lg:py-1.5 px-2 lg:px-4 text-right min-w-[120px]" data-label="Total">
        <div class="flex items-center justify-end space-x-6">
            <span class="text-sm font-black text-gray-900" id="total-{{ product.id }}">{% if product.is_disabled %}₹0{% else %}₹0{% endif %}</span>
            <button id="remove-btn-{{ product.id }}" onclick="removeFromCart('{{ product.id }}')" 
                    class="hidden p-3 text-white bg-auraa-red hover:bg-white hover:text-auraa-red rounded-2xl transition-all shadow-lg hover:-rotate-12">
                <i data-lucide="trash-2" class="w-4 h-4"></i>
            </button>
        </div>
    </td>
</tr>
