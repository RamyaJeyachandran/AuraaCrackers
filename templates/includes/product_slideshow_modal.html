{% load static %}
<div id="product-slideshow-modal" class="hidden fixed inset-0 z-[200000] flex items-center justify-center p-4">
    <!-- Light Transparent Backdrop with Outside Click to Close -->
    <div class="absolute inset-0 bg-white/20 backdrop-blur-2xl" onclick="closeProductSlideshow()"></div>
    
    <div class="relative w-full max-w-2xl bg-white rounded-[2.5rem] overflow-hidden shadow-[0_50px_100px_-20px_rgba(0,0,0,0.3)] transition-all scale-95 opacity-0 duration-500" id="slideshow-container">
        <!-- Close Button -->
        <button onclick="closeProductSlideshow()" class="absolute top-6 right-6 z-30 p-3 bg-auraa-red hover:bg-red-700 text-white backdrop-blur-md rounded-xl transition-all shadow-lg">
            <i data-lucide="x" class="w-5 h-5"></i>
        </button>

        <!-- Slideshow Wrapper -->
        <div class="relative w-full aspect-[16/10] bg-white">
            <div id="slideshow-track" class="flex h-full w-[400%] transition-transform duration-700 ease-[cubic-bezier(0.23,1,0.32,1)]">
                <!-- Slide 1: Product Image -->
                <div class="w-1/4 h-full flex items-center justify-center p-4">
                    <img id="ss-product-img" src="" alt="Product" class="max-w-full max-h-full object-contain drop-shadow-lg">
                </div>
                <!-- Slide 2: Logo -->
                <div class="w-1/4 h-full flex items-center justify-center p-6 bg-gray-50">
                    <img src="{% static 'images/logo.png' %}" alt="Auraa Logo" class="max-w-[200px] object-contain">
                </div>
                <!-- Slide 3: Logo -->
                <div class="w-1/4 h-full flex items-center justify-center p-6">
                    <img src="{% static 'images/logo.png' %}" alt="Auraa Logo" class="max-w-[200px] object-contain grayscale opacity-20">
                </div>
                <!-- Slide 4: Video -->
                <div class="w-1/4 h-full flex items-center justify-center bg-black">
                    <video id="ss-video" class="w-full h-full object-contain" loop playsinline>
                        <source src="{% static 'images/product_welcome.mp4' %}" type="video/mp4">
                    </video>
                    <div class="absolute inset-0 flex items-center justify-center pointer-events-none">
                        <div class="bg-auraa-red/80 backdrop-blur-md p-4 rounded-full text-white shadow-2xl">
                            <i data-lucide="play" class="w-6 h-6 fill-current"></i>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Side Navigation Arrows -->
            <button onclick="moveSlide(-1)" class="absolute left-4 top-1/2 -translate-y-1/2 z-30 p-2 bg-auraa-red hover:bg-red-700 text-white rounded-full shadow-xl transition-all scale-75 md:scale-100 active:scale-90">
                <i data-lucide="chevron-left" class="w-5 h-5"></i>
            </button>
            <button onclick="moveSlide(1)" class="absolute right-4 top-1/2 -translate-y-1/2 z-30 p-2 bg-auraa-red hover:bg-red-700 text-white rounded-full shadow-xl transition-all scale-75 md:scale-100 active:scale-90">
                <i data-lucide="chevron-right" class="w-5 h-5"></i>
            </button>

            <!-- Pagination Dots -->
            <div class="absolute bottom-4 left-0 right-0 z-20 flex justify-center items-center">
                <div class="flex space-x-2 px-3 py-1.5 bg-black/10 backdrop-blur-sm rounded-full" id="slideshow-dots">
                    <div class="w-2.5 h-2.5 rounded-full bg-auraa-red transition-all duration-300" data-index="0"></div>
                    <div class="w-2.5 h-2.5 rounded-full bg-white transition-all duration-300" data-index="1"></div>
                    <div class="w-2.5 h-2.5 rounded-full bg-white transition-all duration-300" data-index="2"></div>
                    <div class="w-2.5 h-2.5 rounded-full bg-white transition-all duration-300" data-index="3"></div>
                </div>
            </div>
        </div>

        <!-- Footer Info -->
        <div class="p-6 md:p-8 bg-[#0A325A] text-white">
            <h3 id="ss-product-name" class="text-2xl md:text-3xl font-black uppercase tracking-tighter text-center">Product Name</h3>
        </div>
    </div>
</div>

<script>
    let currentSlideIndex = 0;
    const totalSlides = 4;
    let autoSlideInterval;

    function openProductSlideshow(imgSrc, name) {
        const modal = document.getElementById('product-slideshow-modal');
        const container = document.getElementById('slideshow-container');
        const productImg = document.getElementById('ss-product-img');
        const productName = document.getElementById('ss-product-name');
        const video = document.getElementById('ss-video');

        // Reset to first slide
        currentSlideIndex = 0;
        updateSlidePosition();

        // Set content
        productImg.src = imgSrc;
        productName.innerText = name;

        // Show modal
        modal.classList.remove('hidden');
        setTimeout(() => {
            container.classList.remove('scale-95', 'opacity-0');
            container.classList.add('scale-100', 'opacity-100');
        }, 50);

        // Start video if on slide 4 (unlikely at start)
        video.pause();
        video.currentTime = 0;

        if (window.lucide) lucide.createIcons();
        
        // Start auto-slide
        startAutoSlide();
    }

    function closeProductSlideshow() {
        const modal = document.getElementById('product-slideshow-modal');
        const container = document.getElementById('slideshow-container');
        const video = document.getElementById('ss-video');

        container.classList.add('scale-95', 'opacity-0');
        container.classList.remove('scale-100', 'opacity-100');
        
        video.pause();
        stopAutoSlide();

        setTimeout(() => {
            modal.classList.add('hidden');
        }, 500);
    }

    function moveSlide(direction) {
        currentSlideIndex = (currentSlideIndex + direction + totalSlides) % totalSlides;
        updateSlidePosition();
        stopAutoSlide(); // Pause auto-slide on manual interaction
    }

    function updateSlidePosition() {
        const track = document.getElementById('slideshow-track');
        const dots = document.querySelectorAll('#slideshow-dots div');
        const video = document.getElementById('ss-video');

        track.style.transform = `translateX(-${currentSlideIndex * 25}%)`;

        // Update dots
        dots.forEach((dot, idx) => {
            if (idx === currentSlideIndex) {
                dot.classList.add('bg-auraa-red', 'w-6');
                dot.classList.remove('bg-white', 'w-2.5');
            } else {
                dot.classList.remove('bg-auraa-red', 'w-6');
                dot.classList.add('bg-white', 'w-2.5');
            }
        });

        // Handle video playback
        if (currentSlideIndex === 3) {
            video.play();
        } else {
            video.pause();
        }
    }

    function startAutoSlide() {
        stopAutoSlide();
        autoSlideInterval = setInterval(() => {
            currentSlideIndex = (currentSlideIndex + 1) % totalSlides;
            updateSlidePosition();
        }, 5000);
    }

    function stopAutoSlide() {
        if (autoSlideInterval) clearInterval(autoSlideInterval);
    }
</script>
