{% load static %}
{% if request.resolver_match.url_name != 'login' and '/admin/' not in request.path and '/dashboard/' not in request.path %}
<div class="bg-gradient-to-b from-[#f5071d] to-[#d4061a] py-1 hidden lg:block border-t border-white/20 border-b border-black/30 shadow-[0_15px_35px_-15px_rgba(0,0,0,0.4)] relative z-[60]">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="flex justify-between items-center">
            <!-- Logo Section with Premium 3D Preview (Perfect Fit) -->
            <a href="{% url 'home' %}" class="flex items-center group relative z-[75]">
                <!-- Main Logo Container -->
                <div class="h-[120px] w-[120px] rounded-2xl overflow-hidden border border-white/30 shadow-[0_15px_35px_-10px_rgba(0,0,0,0.5)] bg-white transition-all transform group-hover:scale-105 group-hover:-translate-y-1 duration-500">
                    <img src="{% static 'images/logo.png' %}" alt="Auraa Crackers" class="w-full h-full object-cover p-0 scale-[1.35] transition-transform duration-700 group-hover:scale-[1.5]">
                </div>

                <!-- Hover Popout Preview (Perfectly Cropped & Seamless) -->
                <div class="absolute top-[85%] left-[140%] -translate-y-0 w-80 h-80 bg-white rounded-[3rem] shadow-[0_60px_120px_-20px_rgba(0,0,0,0.8),0_0_50px_rgba(255,255,255,0.4)] opacity-0 invisible group-hover:opacity-100 group-hover:visible group-hover:scale-110 transition-all duration-500 z-[999] pointer-events-none flex items-center justify-center transform origin-top-left overflow-hidden">
                    <div class="absolute inset-0 bg-white rounded-[inherit]"></div>
                    <!-- Crop Container to Hide Image Edge Borders -->
                    <div class="w-full h-full overflow-hidden flex items-center justify-center rounded-[2rem] relative z-10 transition-all duration-500 group-hover:scale-105">
                        <img src="{% static 'images/logo.png' %}" alt="Auraa Preview" class="w-full h-full object-cover mix-blend-multiply scale-[1.25]">
                    </div>
                    <!-- Premium Glass Shine Overlay -->
                    <div class="absolute inset-0 bg-gradient-to-tr from-white/40 via-transparent to-white/20 rounded-[inherit] z-20"></div>
                </div>
            </a>

            <!-- Contact Blocks with 3D Card Effect -->
            <div class="flex items-center space-x-4 ml-12">
                <!-- Payment Confirm -->
                <div class="flex items-center space-x-3 bg-black/20 backdrop-blur-md px-4 py-3 rounded-2xl border border-white/10 shadow-[inset_0_1px_1px_rgba(255,255,255,0.1),0_4px_6px_rgba(0,0,0,0.2)] hover:scale-105 hover:bg-black/30 transition-all duration-300 group">
                    <div class="w-10 h-10 bg-white rounded-xl flex items-center justify-center text-auraa-red shadow-[0_4px_8px_rgba(0,0,0,0.3)] transform transition-transform group-hover:rotate-12">
                        <i data-lucide="credit-card" class="w-5 h-5"></i>
                    </div>
                    <div class="flex flex-col">
                        <a href="tel:+919080560340" 
                           class="auraa-phone text-xs font-extrabold text-white leading-none tracking-tight mb-1 notranslate"
                           data-wp-number="919080560340"
                           data-wp-message="Hello Auraa Crackers! I would like to know how to make the payment for my order. Could you please guide me?"
                           data-phone-label="Payment Confirm">+91 90805 60340</a>
                        <span class="inline-block px-4 py-1 rounded-full bg-white text-[10px] font-black text-auraa-red uppercase tracking-widest whitespace-nowrap w-full text-center shadow-lg">Payment Confirm</span>
                    </div>
                </div>

                <!-- Dispatch Details -->
                <div class="flex items-center space-x-3 bg-black/20 backdrop-blur-md px-4 py-3 rounded-2xl border border-white/10 shadow-[inset_0_1px_1px_rgba(255,255,255,0.1),0_4px_6px_rgba(0,0,0,0.2)] hover:scale-105 hover:bg-black/30 transition-all duration-300 group">
                    <div class="w-10 h-10 bg-white rounded-xl flex items-center justify-center text-auraa-red shadow-[0_4px_8px_rgba(0,0,0,0.3)] transform transition-transform group-hover:rotate-12">
                        <i data-lucide="truck" class="w-5 h-5"></i>
                    </div>
                    <div class="flex flex-col">
                        <a href="tel:+919677570276" 
                           class="auraa-phone text-xs font-extrabold text-white leading-none tracking-tight mb-1 notranslate"
                           data-wp-number="919677570276"
                           data-wp-message="Hello Auraa Crackers! I would like to know the dispatch and delivery status of my order. Please update me."
                           data-phone-label="Dispatch Details">+91 96775 70276</a>
                        <span class="inline-block px-4 py-1 rounded-full bg-white text-[10px] font-black text-auraa-red uppercase tracking-widest whitespace-nowrap w-full text-center shadow-lg">Dispatch Details</span>
                    </div>
                </div>

                <!-- Direct Support -->
                <div class="flex items-center space-x-3 bg-black/20 backdrop-blur-md px-4 py-3 rounded-2xl border border-white/10 shadow-[inset_0_1px_1px_rgba(255,255,255,0.1),0_4_6px_rgba(0,0,0,0.2)] hover:scale-105 hover:bg-black/30 transition-all duration-300 group">
                    <div class="w-10 h-10 bg-white rounded-xl flex items-center justify-center text-auraa-red shadow-[0_4px_8px_rgba(0,0,0,0.3)] transform transition-transform group-hover:rotate-12">
                        <i data-lucide="phone" class="w-5 h-5"></i>
                    </div>
                    <div class="flex flex-col">
                        <a href="tel:+916381426206" 
                           class="auraa-phone text-xs font-extrabold text-white leading-none tracking-tight mb-1 notranslate"
                           data-wp-number="916381426206"
                           data-wp-message="Hello Auraa Crackers! I need direct support regarding my order. Could you please help me?"
                           data-phone-label="Direct Support">+91 63814 26206</a>
                        <span class="inline-block px-4 py-1 rounded-full bg-white text-[10px] font-black text-auraa-red uppercase tracking-widest whitespace-nowrap w-full text-center shadow-lg">Direct Support</span>
                    </div>
                </div>

                <!-- Customer Support -->
                <div class="flex items-center space-x-3 bg-black/20 backdrop-blur-md px-4 py-3 rounded-2xl border border-white/10 shadow-[inset_0_1px_1px_rgba(255,255,255,0.1),0_4px_6px_rgba(0,0,0,0.2)] hover:scale-105 hover:bg-black/30 transition-all duration-300 group">
                    <div class="w-10 h-10 bg-white rounded-xl flex items-center justify-center text-auraa-red shadow-[0_4px_8px_rgba(0,0,0,0.3)] transform transition-transform group-hover:rotate-12">
                        <i data-lucide="headphones" class="w-5 h-5"></i>
                    </div>
                    <div class="flex flex-col">
                        <a href="tel:+919489435625" 
                           class="auraa-phone text-xs font-extrabold text-white leading-none tracking-tight mb-1 notranslate"
                           data-wp-number="919489435625"
                           data-wp-message="Hello Auraa Crackers! I need assistance with my order. Could you please help me?"
                           data-phone-label="Customer Support">+91 94894 35625</a>
                        <span class="inline-block px-4 py-1 rounded-full bg-white text-[10px] font-black text-auraa-red uppercase tracking-widest whitespace-nowrap w-full text-center shadow-lg">Customer Support</span>
                    </div>
                </div>

                <!-- Language Selector (New Location) -->
                <div class="auraa-translator-container notranslate">
                    <button class="auraa-translator-trigger flex items-center space-x-2 bg-[#0A325A] hover:bg-[#0F457A] px-3 py-1.5 rounded-xl border border-white/10 shadow-lg transition-all duration-300 group">
                        <div class="w-6 h-6 bg-white/5 rounded-lg flex items-center justify-center text-[#FFD700]">
                            <svg class="w-3.5 h-3.5 fill-current" viewBox="0 0 24 24">
                                <circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="1.5" fill="none"></circle>
                                <line x1="2" y1="12" x2="22" y2="12" stroke="currentColor" stroke-width="1.5"></line>
                                <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z" stroke="currentColor" stroke-width="1.5"></path>
                            </svg>
                        </div>
                        <span class="auraa-current-lang text-[10px] font-black text-white uppercase tracking-tighter">Translate</span>
                        <i data-lucide="chevron-down" class="chevron w-2.5 h-2.5 text-white/50 ml-0.5"></i>
                    </button>
                    <div class="auraa-translator-dropdown">
                        <div class="auraa-translator-search">
                            <input type="text" placeholder="Search language...">
                        </div>
                        <div class="auraa-language-list" id="auraa-language-list-topbar">
                            <!-- Populated by JS -->
                        </div>
                        <div class="auraa-translator-footer">
                            <button class="auraa-reset-btn">Show Original (English)</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endif %}
